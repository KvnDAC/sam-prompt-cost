<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1355 994" width="1355" height="994" font-family="Arial, Helvetica, sans-serif">
  <!-- Hand-drawn methodology diagram for the WAIMLAp 2026 poster. One user unit = one Canva px (96 px/in) at the slot size. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#28282D"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#238B8E"/>
    </marker>
  </defs>

  <!-- Row 1: frozen SAM pipeline -->
  <g>
    <rect x="10" y="30" width="210" height="180" rx="22" fill="#FFFFFF" stroke="#4B2A82" stroke-width="3"/>
    <rect x="45" y="55" width="140" height="95" rx="12" fill="#F2D5CB"/>
    <ellipse cx="128" cy="98" rx="30" ry="24" fill="#E76F51" opacity="0.85"/>
    <text x="115" y="188" text-anchor="middle" font-size="26" font-weight="bold" fill="#28282D">RGB image</text>

    <line x1="222" y1="120" x2="286" y2="120" stroke="#28282D" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="290" y="30" width="300" height="180" rx="22" fill="#4B2A82"/>
    <text x="440" y="108" text-anchor="middle" font-size="29" font-weight="bold" fill="#FFFFFF">SAM image encoder</text>
    <text x="440" y="148" text-anchor="middle" font-size="25" fill="#FFFFFF">ViT-B · frozen</text>

    <line x1="592" y1="120" x2="666" y2="120" stroke="#28282D" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="629" y="100" text-anchor="middle" font-size="20" fill="#64646E">features</text>

    <rect x="670" y="30" width="330" height="180" rx="22" fill="#4B2A82"/>
    <text x="835" y="92" text-anchor="middle" font-size="29" font-weight="bold" fill="#FFFFFF">Prompt encoder +</text>
    <text x="835" y="128" text-anchor="middle" font-size="29" font-weight="bold" fill="#FFFFFF">mask decoder</text>
    <text x="835" y="166" text-anchor="middle" font-size="25" fill="#FFFFFF">frozen</text>

    <line x1="1002" y1="120" x2="1076" y2="120" stroke="#28282D" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1080" y="30" width="265" height="180" rx="22" fill="#FFFFFF" stroke="#4B2A82" stroke-width="3"/>
    <text x="1212" y="112" text-anchor="middle" font-size="29" font-weight="bold" fill="#28282D">Mask</text>
    <text x="1212" y="150" text-anchor="middle" font-size="22" fill="#64646E">single output</text>
  </g>

  <!-- Row 2: prompt sources, one per condition -->
  <g>
    <rect x="290" y="285" width="1055" height="400" rx="22" fill="#FFFFFF" stroke="#E6E1F0" stroke-width="3"/>
    <text x="320" y="333" font-size="28" font-weight="bold" fill="#4B2A82">Prompt source (one per condition)</text>

    <circle cx="335" cy="380" r="13" fill="#D9D3E6"/>
    <text x="362" y="389" font-size="25" fill="#28282D"><tspan font-weight="bold">None</tspan> — empty spatial input</text>

    <circle cx="335" cy="436" r="13" fill="#7A7A7A"/>
    <text x="362" y="445" font-size="25" fill="#28282D"><tspan font-weight="bold">GT point / GT box</tspan> — oracle ceiling, not deployable</text>

    <circle cx="335" cy="492" r="13" fill="#D9D3E6"/>
    <text x="362" y="501" font-size="25" fill="#28282D"><tspan font-weight="bold">Fixed prior</tspan> — median box + point of training masks</text>

    <circle cx="335" cy="548" r="13" fill="#B8A1D9"/>
    <text x="362" y="557" font-size="25" fill="#28282D"><tspan font-weight="bold">Learned tokens</tspan> — 4 static or 4 image-conditioned</text>

    <circle cx="335" cy="612" r="13" fill="#238B8E"/>
    <text x="362" y="621" font-size="25" fill="#28282D"><tspan font-weight="bold">Linear probe</tspan> (257 params) → largest component → box + point</text>
    <text x="362" y="657" font-size="25" fill="#4B2A82" font-weight="bold">= Auto SAM</text>

    <!-- prompts enter the decoder -->
    <line x1="835" y1="283" x2="835" y2="214" stroke="#28282D" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="850" y="258" font-size="20" fill="#64646E">prompt</text>
    <!-- encoder features feed the probe and the conditioned tokens -->
    <path d="M440 212 V255 H270 V612 H318" fill="none" stroke="#238B8E" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#arrow-teal)"/>
  </g>

  <!-- Row 3: direct comparator -->
  <g>
    <path d="M115 212 V800 H286" fill="none" stroke="#28282D" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="290" y="740" width="710" height="120" rx="22" fill="#E76F51"/>
    <text x="645" y="792" text-anchor="middle" font-size="29" font-weight="bold" fill="#FFFFFF">U-Net comparator</text>
    <text x="645" y="830" text-anchor="middle" font-size="25" fill="#FFFFFF">487k params · trained from scratch on the same images</text>
    <line x1="1002" y1="800" x2="1076" y2="800" stroke="#28282D" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1080" y="740" width="265" height="120" rx="22" fill="#FFFFFF" stroke="#E76F51" stroke-width="3"/>
    <text x="1212" y="810" text-anchor="middle" font-size="29" font-weight="bold" fill="#28282D">Mask</text>
  </g>

  <!-- Row 4: evaluation sets -->
  <g>
    <rect x="10" y="895" width="435" height="92" rx="18" fill="#F5F3F9" stroke="#E6E1F0" stroke-width="2"/>
    <text x="227" y="933" text-anchor="middle" font-size="24" font-weight="bold" fill="#28282D">Kvasir-SEG dev · 100</text>
    <text x="227" y="969" text-anchor="middle" font-size="22" fill="#64646E">Dice, exploratory</text>

    <rect x="460" y="895" width="435" height="92" rx="18" fill="#F5F3F9" stroke="#E6E1F0" stroke-width="2"/>
    <text x="677" y="933" text-anchor="middle" font-size="24" font-weight="bold" fill="#28282D">CVC-ClinicDB · 612 / 29 seq.</text>
    <text x="677" y="969" text-anchor="middle" font-size="22" fill="#64646E">Dice, frozen transfer</text>

    <rect x="910" y="895" width="435" height="92" rx="18" fill="#F5F3F9" stroke="#E6E1F0" stroke-width="2"/>
    <text x="1127" y="933" text-anchor="middle" font-size="24" font-weight="bold" fill="#28282D">HyperKvasir cecum · 1,009</text>
    <text x="1127" y="969" text-anchor="middle" font-size="22" fill="#64646E">false area, polyp-free</text>
  </g>
</svg>
